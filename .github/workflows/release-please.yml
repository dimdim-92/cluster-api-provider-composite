name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check release App configuration
        id: app-config
        shell: bash
        env:
          APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_ID" && -z "$APP_PRIVATE_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release automation is not configured; set RELEASE_PLEASE_APP_ID and RELEASE_PLEASE_APP_PRIVATE_KEY to enable it."
            echo "Release automation is not configured. No release PR or tag was created. Configure both RELEASE_PLEASE_APP_ID and RELEASE_PLEASE_APP_PRIVATE_KEY Actions secrets to enable it." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Release automation requires both RELEASE_PLEASE_APP_ID and RELEASE_PLEASE_APP_PRIVATE_KEY Actions secrets."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      # The App maintains version/changelog PRs. A maintainer prepares the reviewed
      # draft and annotated tag; the tag-push workflow owns immutable publication.
      - name: Generate scoped GitHub App token
        id: app-token
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Maintain version and changelog PRs
        if: steps.app-config.outputs.configured == 'true'
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
