version: "2"
run:
  relative-path-mode: gomod
linters:
  default: none
  enable:
    - kubeapilinter
  settings:
    custom:
      kubeapilinter:
        type: module
        description: Kubernetes API conventions for the isolated Composite API module.
        settings:
          linters:
            enable:
              - "*"
            disable:
              - nonpointerstructs # Native Go-validated APIs only, not CRDs.
          lintersConfig:
            conflictingmarkers:
              conflicts:
                - name: optional_vs_required
                  sets:
                    - [optional, "kubebuilder:validation:Optional", "k8s:optional"]
                    - [required, "kubebuilder:validation:Required", "k8s:required"]
                  description: A field cannot be both optional and required.
                - name: default_vs_required
                  sets:
                    - [default, "kubebuilder:default"]
                    - [required, "kubebuilder:validation:Required", "k8s:required"]
                  description: A required field cannot have a default.
            namingconventions:
              conventions:
                - name: TimeNotTimestamp
                  violationMatcher: "(?i)timestamp"
                  operation: Inform
                  message: Use the Time suffix for timestamps, following Kubernetes API conventions.
            conditions:
              isFirstField: Warn
              usePatchStrategy: Forbid
              useProtobuf: Forbid
            optionalfields:
              pointers:
                preference: WhenRequired
                policy: SuggestFix
            forbiddenmarkers:
              markers:
                - identifier: kubebuilder:default
                - identifier: default
            dependenttags:
              rules:
                - identifier: listMapKey
                  type: All
                  dependsOn: [listType]
            preferredmarkers:
              markers:
                - preferredIdentifier: optional
                  equivalentIdentifiers:
                    - identifier: kubebuilder:validation:Optional
                - preferredIdentifier: required
                  equivalentIdentifiers:
                    - identifier: kubebuilder:validation:Required
  exclusions:
    generated: strict
    rules:
      # Empty infrastructure specs are valid. Preserve the public Go value types:
      # omitempty keeps these struct objects on the wire; omitzero must not be used.
      - path: v1beta2/compositecluster_types\.go$
        text: '^requiredfields: field CompositeCluster\.Spec has a valid zero value '
        linters: [kubeapilinter]
      - path: v1beta2/compositeclustertemplate_types\.go$
        text: '^requiredfields: field (CompositeClusterTemplateResource\.Spec|CompositeClusterTemplateSpec\.Template|CompositeClusterTemplate\.Spec) has a valid zero value '
        linters: [kubeapilinter]
      # Template wrappers must also serialize their required nested spec: {}.
      # omitzero would drop that valid configuration instead of encoding it.
      - path: v1beta2/compositeclustertemplate_types\.go$
        text: '^requiredfields: field (CompositeClusterTemplateSpec\.Template|CompositeClusterTemplate\.Spec) does not allow the zero value\. It must have the omitzero tag\.'
        linters: [kubeapilinter]
      # These exact booleans are CAPI wire-contract fields or their per-provider mirror.
      - path: v1beta2/common_types\.go$
        text: '^nobools: field FailureDomain\.ControlPlane pointer '
        linters: [kubeapilinter]
      - path: v1beta2/compositecluster_types\.go$
        text: '^nobools: field (InitializationStatus|ProviderStatus)\.Provisioned pointer '
        linters: [kubeapilinter]
      # Preserve existing Go reference pointers; nil explicitly means no observed child.
      - path: v1beta2/compositecluster_types\.go$
        text: '^optionalfields: field ProviderStatus\.(ChildRef|BootstrapTemplateRef) does not allow the zero value\. The field does not need to be a pointer\.'
        linters: [kubeapilinter]
      # Empty diagnostics/status and zero observedGeneration already mean unobserved/absent.
      # Keep accepted wire values and Go shapes instead of tightening the beta API for lint.
      - path: v1beta2/compositecluster_types\.go$
        text: '^optionalfields: field (ProviderStatus\.(Reason|Message)|CompositeClusterStatus\.(ProviderNames|Reason|Message)) has a valid zero value \(""\) and should be a pointer\.'
        linters: [kubeapilinter]
      - path: v1beta2/compositecluster_types\.go$
        text: '^optionalfields: field CompositeClusterStatus\.ObservedGeneration has a valid zero value \(0\), '
        linters: [kubeapilinter]
      - path: v1beta2/compositecluster_types\.go$
        text: '^optionalfields: field CompositeCluster\.Status has a valid zero value \(\{\}\) and should be a pointer\.'
        linters: [kubeapilinter]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
