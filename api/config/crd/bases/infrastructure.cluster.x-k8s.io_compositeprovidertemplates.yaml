              rule: self == oldSelf
            - message: infrastructure template must match the native InfraCluster
                kind and group
              rule: self.infrastructureTemplateRef.kind == self.infraClusterKind.kind
                + 'Template' && self.infrastructureTemplateRef.apiVersion.startsWith(self.infraClusterKind.apiGroup
