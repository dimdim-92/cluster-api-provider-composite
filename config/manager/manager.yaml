apiVersion: apps/v1
kind: Deployment
metadata:
  name: composite-controller-manager
  labels:
    app.kubernetes.io/name: cluster-api-provider-composite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-api-provider-composite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-api-provider-composite
    spec:
      serviceAccountName: composite-manager
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/numspot/cluster-api-provider-composite:dev
          args:
            - --leader-elect
            - --diagnostics-address=:5555
            - --health-addr=:2112
          env:
            - name: WATCH_FILTER
              value: "${COMPOSITE_WATCH_FILTER:=}"
          ports:
            - name: metrics
              containerPort: 5555
            - name: health
              containerPort: 2112
          livenessProbe:
            httpGet:
              path: /ping
              port: health
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
