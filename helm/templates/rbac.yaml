apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "composite.roleName" . | quote }}
  labels:
    {{- include "composite.labels" . | nindent 4 }}
rules:
  {{- include "composite.rbacRules" . | nindent 2 }}
  {{- with .Values.additionalRBACRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "composite.roleName" . | quote }}
  labels:
    {{- include "composite.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "composite.roleName" . | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "composite.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-metrics-reader" (include "composite.roleName" .) | quote }}
  labels:
    {{- include "composite.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: [/metrics]
    verbs: [get]
