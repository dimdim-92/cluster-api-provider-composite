# Shared, administrator-managed source revisions. Composite reads only spec.template.spec.
# Edit credential references and defaults before first use. Credential Secrets must
# exist where the native consumer expects them, not automatically in this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: composite-templates
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OscClusterTemplate
metadata:
  name: outscale-account-a-r1
  namespace: composite-templates
spec:
  template:
    spec:
      credentials:
        fromSecret: outscale-account-a-eu-west-2
      network:
        disable: [loadbalancer]
        natService: {}
        net:
          ipRange: 10.42.0.0/16
        subregions: [eu-west-2a]
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: outscale-bootstrap-r1
  namespace: composite-templates
spec:
  template:
    spec:
      format: cloud-config
      joinConfiguration:
        nodeRegistration:
          name: "{{ ds.meta_data.local_hostname }}"
          imagePullPolicy: IfNotPresent
          kubeletExtraArgs:
            - name: provider-id
              value: "aws:///{{ ds.meta_data.placement.availability_zone }}/{{ ds.meta_data.instance_id }}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackClusterTemplate
metadata:
  name: openstack-account-a-r1
  namespace: composite-templates
spec:
  template:
    spec:
      apiServerLoadBalancer:
        enabled: false
      disableAPIServerFloatingIP: true
      disableExternalNetwork: true
      identityRef:
        type: Secret
        name: openstack-account-a-eu-west-par
        cloudName: openstack
        region: EU-WEST-PAR
      managedSubnets:
        - cidr: 10.6.0.0/24
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: openstack-bootstrap-r1
  namespace: composite-templates
spec:
  template:
    spec:
      format: cloud-config
      joinConfiguration:
        nodeRegistration:
          name: "{{ ds.meta_data.local_hostname }}"
          imagePullPolicy: IfNotPresent
          kubeletExtraArgs:
            - name: provider-id
              value: "openstack:///{{ ds.meta_data.uuid }}"
      # Adapt or remove these commands when using a Kubernetes-ready image.
      preKubeadmCommands:
        - modprobe br_netfilter && echo br_netfilter > /etc/modules-load.d/k8s.conf
        - sysctl -w net.ipv4.ip_forward=1 net.bridge.bridge-nf-call-iptables=1
        - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y apt-transport-https ca-certificates curl gpg containerd
        - containerd config default | sed "s/SystemdCgroup = false/SystemdCgroup = true/" > /etc/containerd/config.toml && systemctl restart containerd
        - mkdir -p /etc/apt/keyrings && curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
        - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y kubelet kubeadm
