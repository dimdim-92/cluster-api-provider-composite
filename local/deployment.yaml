apiVersion: apps/v1
kind: Deployment
metadata:
  name: capi-composite-controller
  namespace: capi-composite-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: capi-composite-controller}
  template:
    metadata:
      labels: {app: capi-composite-controller}
    spec:
      serviceAccountName: capi-composite
      containers:
        - name: controller
          image: localhost:5001/capi-composite-controller
          ports:
            - {name: health,  containerPort: 2112}
            - {name: metrics, containerPort: 5555}
            - {name: delve,   containerPort: 50100}
          env:
            - {name: LOG_LEVEL, value: debug}
          # Debugging only: probes are omitted so pausing at a breakpoint does not
          # restart the process. Use the Helm or clusterctl manifests for installation.
