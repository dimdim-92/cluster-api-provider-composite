# Provider attachments are separate CompositeProvider resources, not topology inputs.
apiVersion: apiextensions.managedservice.numspot.com/v1alpha2
kind: ManagedServiceClass
metadata:
  name: kubernetes-composite-v1
  namespace: cloud-kubernetes
spec:
  domain: kubernetes
  resourceType: cluster
  resource:
    cluster:
      apiVersion:
        group: cluster.x-k8s.io
        version: v1beta2
        kind: Cluster
        resource: clusters
      manifest:
        apiVersion: cluster.x-k8s.io/v1beta2
        kind: Cluster
        metadata:
          name: cluster-${parameters.clusterId}
        spec:
          topology:
            classRef:
              name: composite-v1
              namespace: composite-templates
            version: ""
            controlPlane:
              replicas: 1
            variables:
              - name: controlPlaneNetwork
                value: {}
              - name: datastoreName
                value: default
          clusterNetwork:
            pods:
              cidrBlocks: [172.16.0.0/16]
            services:
              cidrBlocks: [10.96.0.0/12]
  variables:
    - name: clusterId
      required: true
      schema:
        type: string
        minLength: 1
        # cluster-<id>-infra must remain <=63 chars for deterministic CAPI naming.
        maxLength: 49
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
    - name: clusterVersion
      required: true
      mutable: true
      schema:
        type: string
        pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    - name: replicas
      mutable: true
      schema:
        type: integer
        minimum: 1
        maximum: 5
        default: 1
    - name: controlPlaneNetwork
      required: true
      schema:
        type: object
        additionalProperties: false
        required: [serviceType]
        properties:
          serviceType: {type: string, enum: [LoadBalancer, NodePort]}
          serviceAddress: {type: string}
          certSANs: {type: array, items: {type: string}}
          serviceAnnotations: {type: object, additionalProperties: {type: string}}
    - name: datastoreName
      schema:
        type: string
        minLength: 1
        default: default
  # MSC JSONPath patches set topology variables on the Cluster it manages.
  # ClusterClass patches configure only the hosted control plane.
  patches:
    - name: topology-version
      jsonPath: $.cluster.spec.topology.version
      valueFrom: {variable: clusterVersion}
    - name: topology-replicas
      jsonPath: $.cluster.spec.topology.controlPlane.replicas
      valueFrom: {variable: replicas}
    - name: topology-network
      jsonPath: $.cluster.spec.topology.variables[0].value
      valueFrom: {variable: controlPlaneNetwork}
    - name: topology-datastore
      jsonPath: $.cluster.spec.topology.variables[1].value
      valueFrom: {variable: datastoreName}
  # Gate pool creation on usable infrastructure/control plane, independently of
  # WorkersAvailable: a failing/new pool must not gate its own reconciliation.
  readyWhen:
    - >-
      has(self.resources['cluster'].status.conditions) &&
      ['InfrastructureReady', 'ControlPlaneAvailable', 'RemoteConnectionProbe'].all(type,
        self.resources['cluster'].status.conditions.exists(c,
          c.type == type && c.status == 'True' &&
          c.observedGeneration == self.resources['cluster'].metadata.generation))
  exports:
    - name: clusterName
      expression: self.resources['cluster'].metadata.name
    - name: infrastructureName
      expression: self.resources['cluster'].spec.infrastructureRef.name
    - name: clusterVersion
      expression: self.resources['cluster'].spec.topology.version
  teardown:
    # CAPI owns infrastructure/control-plane deletion; Composite owns its children.
    # The namespace (and its credentials) stays alive while any of these remain.
    blockingResources:
      - {group: cluster.x-k8s.io, version: v1beta2, resource: clusters}
      - {group: cluster.x-k8s.io, version: v1beta2, resource: machines}
      - {group: infrastructure.cluster.x-k8s.io, version: v1beta2, resource: compositeclusters}
      - {group: infrastructure.cluster.x-k8s.io, version: v1beta2, resource: compositeproviders}
      - {group: infrastructure.cluster.x-k8s.io, version: v1beta1, resource: oscclusters}
      - {group: infrastructure.cluster.x-k8s.io, version: v1beta1, resource: openstackclusters}
      - {group: controlplane.cluster.x-k8s.io, version: v1alpha1, resource: kamajicontrolplanes}
