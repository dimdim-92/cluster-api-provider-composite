# Draft for the HCP space classes/templates in cloud-organisation/hcp.
# MSC b852d5e does not expand addonDefinitions on the supplemental-addon path.
apiVersion: apiextensions.managedservice.numspot.com/v1alpha2
kind: ManagedServiceClass
metadata:
  name: outscale-provider-nodepool
  namespace: cloud-kubernetes
spec:
  domain: space
  resourceType: nodepool

  canBeAddonFor:
    - name: space
      namespace: cloud-kubernetes

  variables:
    # Must match the referencing SupplementalAddon's metadata.name.
    # Leaves room for supplemental-<id>-<size>-omt.
    - name: nodePoolId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 37
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

    - name: clusterName
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 57

    - name: clusterVersion
      required: true
      mutable: true
      schema:
        type: string
        pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'

    # Administrator-published template with credentialsNamePaths.
    - name: providerTemplateName
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253

    # Native Secret in the space's target namespace; Composite reads no Secret data.
    - name: credentialsSecretName
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'

    # Replica count per declared worker addon.
    - name: replicas
      mutable: true
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 1

    # Shared image, keypair, disk and network settings. Each addon sets its VM type.
    - name: machineSpec
      required: true
      schema:
        type: object
        required: [node]
        properties:
          node:
            type: object
            required: [image, vm]
            properties:
              image:
                type: object
              vm:
                type: object

  resource:
    provider:
      apiVersion:
        group: infrastructure.cluster.x-k8s.io
        version: v1beta2
        kind: CompositeProvider
        resource: compositeproviders
      manifest:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: CompositeProvider
        metadata:
          # MSC prefixes this with supplemental-<addon-name>-.
          name: provider
        spec:
          clusterRef:
            name: '${parameters.clusterName}-infra'
          templateRef:
            name: '${parameters.providerTemplateName}'
          credentialsRef:
            name: '${parameters.credentialsSecretName}'
          infraSpec:
            network:
              clusterName: '${parameters.clusterName}'
              internetService:
                name: '${parameters.clusterName}'

  # Provider configuration readiness is independent of worker availability.
  readyWhen:
    - >-
      has(self.resources['provider'].status.conditions) &&
      self.resources['provider'].status.conditions.exists(c,
        c.type == 'Ready' &&
        c.status == 'True' &&
        c.observedGeneration == self.resources['provider'].metadata.generation)

  exports:
    - name: providerName
      expression: self.resources['provider'].metadata.name
    - name: bootstrapTemplateName
      expression: parameters.clusterName + '-infra-supplemental-' + parameters.nodePoolId + '-provider'

  addonDefinitions:
    # The referenced worker class must include outscale-provider-nodepool
    # in canBeAddonFor.
    - name: small
      classRef:
        name: outscale-nodepool
        namespace: cloud-kubernetes
      default: true

      # Native workers consume this provider resource's bootstrap output.
      patches:
        - name: worker-vm-type
          jsonPath: $.machineTemplate.spec.template.spec.node.vm.vmType
          valueFrom:
            value: tinav7.c2r4p2

        - name: attachment-bootstrap
          jsonPath: $.machineDeployment.spec.template.spec.bootstrap.configRef.name
          expression: >-
            parameters.clusterName + '-infra-supplemental-' + parameters.nodePoolId + '-provider'

        - name: worker-machine-template
          jsonPath: $.machineDeployment.spec.template.spec.infrastructureRef.name
          expression: >-
            'supplemental-' + parameters.nodePoolId + '-small-omt'

    - name: medium
      classRef:
        name: outscale-nodepool
        namespace: cloud-kubernetes
      default: true

      patches:
        - name: worker-vm-type
          jsonPath: $.machineTemplate.spec.template.spec.node.vm.vmType
          valueFrom:
            value: tinav7.c4r8p2

        - name: attachment-bootstrap
          jsonPath: $.machineDeployment.spec.template.spec.bootstrap.configRef.name
          expression: >-
            parameters.clusterName + '-infra-supplemental-' + parameters.nodePoolId + '-provider'

        - name: worker-machine-template
          jsonPath: $.machineDeployment.spec.template.spec.infrastructureRef.name
          expression: >-
            'supplemental-' + parameters.nodePoolId + '-medium-omt'

    - name: large
      classRef:
        name: outscale-nodepool
        namespace: cloud-kubernetes
      default: true

      patches:
        - name: worker-vm-type
          jsonPath: $.machineTemplate.spec.template.spec.node.vm.vmType
          valueFrom:
            value: tinav7.c8r16p2

        - name: attachment-bootstrap
          jsonPath: $.machineDeployment.spec.template.spec.bootstrap.configRef.name
          expression: >-
            parameters.clusterName + '-infra-supplemental-' + parameters.nodePoolId + '-provider'

        - name: worker-machine-template
          jsonPath: $.machineDeployment.spec.template.spec.infrastructureRef.name
          expression: >-
            'supplemental-' + parameters.nodePoolId + '-large-omt'
