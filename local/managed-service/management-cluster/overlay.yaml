# Environment defaults. Adapt endpoint exposure to the service cluster's LB/DNS.
apiVersion: apiextensions.managedservice.numspot.com/v1alpha2
kind: ManagedServiceOverlay
metadata:
  name: composite-demo-v1
  namespace: cloud-kubernetes
spec:
  classRef:
    name: kubernetes-composite-v1
    namespace: cloud-kubernetes
  variables:
    - name: clusterVersion
      value: v1.34.10
    - name: replicas
      value: "1"
    - name: datastoreName
      value: default
    - name: controlPlaneNetwork
      value: '{"serviceType":"LoadBalancer"}'
