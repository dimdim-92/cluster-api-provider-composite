# Outscale Paris (eu-west-2). Apply on the MSC management cluster.
# Edit the Kubernetes-ready OMI and keypair before applying.
# Apply management-cluster/outscale-nodepool-class.yaml before this request.
# This example does not install or own a node-pool ManagedServiceClass.
apiVersion: apiextensions.managedservice.numspot.com/v1alpha2
kind: ManagedServiceSupplementalAddon
metadata:
  name: demo-osc-paris
  namespace: cloud-kubernetes
spec:
  instanceRef:
    name: demo
  classRef:
    name: composite-outscale-nodepool-v1
    namespace: cloud-kubernetes
  parameters:
    nodePoolId: demo-osc-paris
    clusterName: cluster-demo
    clusterVersion: v1.34.10
    attachment: osc-paris
    availabilityZone: eu-west-2a
    replicas: "1"
    machineSpec: >-
      {"node":{"image":{"name":"replace-with-kubernetes-omi"},
        "vm":{"keypairName":"replace-with-keypair","vmType":"tinav7.c4r8p2",
          "rootDisk":{"rootDiskSize":30,"rootDiskType":"standard"}}}}
