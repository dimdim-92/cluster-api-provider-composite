# OVH Paris (EU-WEST-PAR). Apply on the MSC management cluster.
# Edit the Kubernetes-ready image, network and security group before applying.
apiVersion: apiextensions.managedservice.numspot.com/v1alpha2
# Apply management-cluster/openstack-nodepool-class.yaml before this request.
kind: ManagedServiceSupplementalAddon
metadata:
  name: demo-ovh-paris
  namespace: cloud-kubernetes
spec:
  instanceRef:
    name: demo
  classRef:
    name: composite-openstack-nodepool-v1
    namespace: cloud-kubernetes
  parameters:
    nodePoolId: demo-ovh-paris
    clusterName: cluster-demo
    clusterVersion: v1.34.10
    attachment: ovh-paris
    replicas: "1"
    machineSpec: >-
      {"flavor":"b3-16","image":{"filter":{"name":"replace-with-kubernetes-image"}},
        "identityRef":{"type":"Secret","name":"openstack-account-a-eu-west-par",
          "cloudName":"openstack","region":"EU-WEST-PAR"},
        "ports":[{"network":{"filter":{"name":"Ext-Net"}},
          "securityGroups":[{"filter":{"name":"replace-with-paris-worker-security-group"}}]}]}
