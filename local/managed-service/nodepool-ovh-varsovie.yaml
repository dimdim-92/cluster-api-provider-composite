# OVH Varsovie (WAW1). Apply on the MSC management cluster.
# Edit the Kubernetes-ready image, network, subnet and security group before applying.
apiVersion: apiextensions.managedservice.numspot.com/v1alpha2
# Apply management-cluster/openstack-nodepool-class.yaml before this request.
kind: ManagedServiceSupplementalAddon
metadata:
  name: demo-ovh-varsovie
  namespace: cloud-kubernetes
spec:
  instanceRef:
    name: demo
  classRef:
    name: composite-openstack-nodepool-v1
    namespace: cloud-kubernetes
  parameters:
    nodePoolId: demo-ovh-varsovie
    clusterName: cluster-demo
    clusterVersion: v1.34.10
    attachment: ovh-varsovie
    replicas: "1"
    # CAPO still looks up the canonical Paris OpenStackCluster. Explicit regional
    # credentials, ports and security groups select the Varsovie worker network.
    machineSpec: >-
      {"flavor":"b3-16","image":{"filter":{"name":"replace-with-kubernetes-image"}},
        "identityRef":{"type":"Secret","name":"openstack-account-a-waw1",
          "cloudName":"openstack-waw","region":"WAW1"},
        "ports":[{"network":{"filter":{"name":"replace-with-varsovie-network"}},
          "fixedIPs":[{"subnet":{"filter":{"name":"replace-with-varsovie-subnet"}}}],
          "securityGroups":[{"filter":{"name":"replace-with-varsovie-worker-security-group"}}]}]}
