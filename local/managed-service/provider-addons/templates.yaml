# Shared immutable configuration. Native source objects come from ../service-cluster/provider-templates.yaml.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CompositeProviderTemplate
metadata:
  name: osc-paris-addon-v1
spec:
  provider: outscale
  account: account-a
  region: eu-west-2
  zones: [eu-west-2a]
  credentialsNamePaths: [/credentials/fromSecret]
  infraClusterKind: {apiGroup: infrastructure.cluster.x-k8s.io, kind: OscCluster}
  infrastructureTemplateRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OscClusterTemplate
    namespace: composite-templates
    name: osc-paris-account-a-v1
  bootstrapTemplateRef:
    apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
    kind: KubeadmConfigTemplate
    namespace: composite-templates
    name: outscale-workers-v1
  overridePolicy:
    infraSpecPaths: [/network/clusterName, /network/internetService/name, /network/net/ipRange]
    protectedInfraSpecPaths: [/credentials, /network/subregions, /network/disable]
    bootstrapPaths: [/files, /preKubeadmCommands]
    protectedBootstrapPaths: [/joinConfiguration/nodeRegistration/kubeletExtraArgs]
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CompositeProviderTemplate
metadata:
  name: ovh-paris-addon-v1
spec:
  provider: openstack
  account: account-a
  region: EU-WEST-PAR
  credentialsNamePaths: [/identityRef/name]
  infraClusterKind: {apiGroup: infrastructure.cluster.x-k8s.io, kind: OpenStackCluster}
  endpointPaths: [spec.controlPlaneEndpoint, spec.apiServerFixedIP, spec.apiServerPort]
  infrastructureTemplateRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OpenStackClusterTemplate
    namespace: composite-templates
    name: ovh-paris-account-a-v1
  bootstrapTemplateRef:
    apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
    kind: KubeadmConfigTemplate
    namespace: composite-templates
    name: openstack-workers-v1
  overridePolicy:
    infraSpecPaths: [/managedSubnets]
    protectedInfraSpecPaths: [/identityRef, /apiServerLoadBalancer, /disableAPIServerFloatingIP, /disableExternalNetwork]
    bootstrapPaths: [/files, /preKubeadmCommands]
    protectedBootstrapPaths: [/joinConfiguration/nodeRegistration/kubeletExtraArgs]
---
