apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: composite-v1
  namespace: composite-templates
spec:
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: CompositeClusterTemplate
      name: composite-v1
    # Native providers look up the canonical child using infrastructureRef.name.
    # Keep this stable; node-pool bootstrap refs use the same naming convention.
    naming:
      template: '{{ .cluster.name }}-infra'
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
      kind: KamajiControlPlaneTemplate
      name: composite-kamaji-v1
  # Worker pools are standalone MachineDeployments managed as supplemental addons.
  # Their bootstrap references select Composite's generated per-attachment templates.
  variables:
    - name: controlPlaneNetwork
      required: true
      schema:
        openAPIV3Schema:
          type: object
          required: [serviceType]
          properties:
            serviceType:
              type: string
              enum: [LoadBalancer, NodePort]
            serviceAddress:
              type: string
            certSANs:
              type: array
              items:
                type: string
            serviceAnnotations:
              type: object
              additionalProperties:
                type: string
    - name: datastoreName
      required: true
      schema:
        openAPIV3Schema:
          type: string
          minLength: 1
          default: default
  patches:
    - name: hosted-control-plane
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
            kind: KamajiControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: replace
              path: /spec/template/spec/network
              valueFrom:
                variable: controlPlaneNetwork
            - op: replace
              path: /spec/template/spec/dataStoreName
              valueFrom:
                variable: datastoreName
