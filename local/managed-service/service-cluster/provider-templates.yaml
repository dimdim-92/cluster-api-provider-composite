# Native source templates are immutable named revisions, retained by administrators.
# Only payloads are copied; native Secret references resolve in the consumer namespace.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackClusterTemplate
metadata:
  name: ovh-paris-account-a-v1
  namespace: composite-templates
spec:
  template:
    spec:
      apiServerLoadBalancer:
        enabled: false
      disableAPIServerFloatingIP: true
      disableExternalNetwork: true
      identityRef:
        type: Secret
        name: openstack-account-a-eu-west-par
        cloudName: openstack
        region: EU-WEST-PAR
      managedSubnets:
        - cidr: 10.6.0.0/24
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackClusterTemplate
metadata:
  name: ovh-varsovie-account-a-v1
  namespace: composite-templates
spec:
  template:
    spec:
      apiServerLoadBalancer:
        enabled: false
      disableAPIServerFloatingIP: true
      disableExternalNetwork: true
      identityRef:
        type: Secret
        name: openstack-account-a-waw1
        cloudName: openstack-waw
        region: WAW1
      managedSubnets:
        - cidr: 10.7.0.0/24
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OscClusterTemplate
metadata:
  name: osc-paris-account-a-v1
  namespace: composite-templates
spec:
  template:
    spec:
      credentials:
        fromSecret: outscale-account-a-eu-west-2
      network:
        disable: [loadbalancer]
        natService: {}
        net:
          ipRange: 10.42.0.0/16
        subregions: [eu-west-2a]
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: openstack-workers-v1
  namespace: composite-templates
spec:
  template:
    spec:
      format: cloud-config
      joinConfiguration:
        nodeRegistration:
          name: '{{ ds.meta_data.local_hostname }}'
          imagePullPolicy: IfNotPresent
          kubeletExtraArgs:
            - name: provider-id
              value: 'openstack:///{{ ds.meta_data.uuid }}'
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: outscale-workers-v1
  namespace: composite-templates
spec:
  template:
    spec:
      format: cloud-config
      joinConfiguration:
        nodeRegistration:
          name: '{{ ds.meta_data.local_hostname }}'
          imagePullPolicy: IfNotPresent
          kubeletExtraArgs:
            - name: provider-id
              value: 'aws:///{{ ds.meta_data.placement.availability_zone }}/{{ ds.meta_data.instance_id }}'
