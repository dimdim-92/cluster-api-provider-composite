# Three immutable provider/account/region revisions referencing provider-templates.yaml.
# Supply the referenced native
# Secrets in kubernetes-cluster-<instance-name> on the service cluster.
# Worker images must already contain the matching kubeadm/kubelet/containerd.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CompositeProviderTemplate
metadata:
  name: ovh-paris-account-a-v1
spec:
  provider: openstack
  account: account-a
  region: EU-WEST-PAR
  credentialsRef:
    name: openstack-account-a-eu-west-par
    namePaths: [/identityRef/name]
  infraClusterKind:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: OpenStackCluster
  endpointPaths: [spec.controlPlaneEndpoint, spec.apiServerFixedIP, spec.apiServerPort]
  infrastructureTemplateRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OpenStackClusterTemplate
    namespace: composite-templates
    name: ovh-paris-account-a-v1
  bootstrapTemplateRef:
    apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
    kind: KubeadmConfigTemplate
    namespace: composite-templates
    name: openstack-workers-v1
  overridePolicy:
    infraSpecPaths: [/managedSubnets]
    protectedInfraSpecPaths:
      - /identityRef
      - /apiServerLoadBalancer
      - /disableAPIServerFloatingIP
      - /disableExternalNetwork
    bootstrapPaths: [/files, /preKubeadmCommands]
    protectedBootstrapPaths: [/joinConfiguration/nodeRegistration/kubeletExtraArgs]
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CompositeProviderTemplate
metadata:
  name: ovh-varsovie-account-a-v1
spec:
  provider: openstack
  account: account-a
  region: WAW1
  credentialsRef:
    name: openstack-account-a-waw1
    namePaths: [/identityRef/name]
  infraClusterKind:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: OpenStackCluster
  endpointPaths: [spec.controlPlaneEndpoint, spec.apiServerFixedIP, spec.apiServerPort]
  infrastructureTemplateRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OpenStackClusterTemplate
    namespace: composite-templates
    name: ovh-varsovie-account-a-v1
  bootstrapTemplateRef:
    apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
    kind: KubeadmConfigTemplate
    namespace: composite-templates
    name: openstack-workers-v1
  overridePolicy:
    infraSpecPaths: [/managedSubnets]
    protectedInfraSpecPaths:
      - /identityRef
      - /apiServerLoadBalancer
      - /disableAPIServerFloatingIP
      - /disableExternalNetwork
    bootstrapPaths: [/files, /preKubeadmCommands]
    protectedBootstrapPaths: [/joinConfiguration/nodeRegistration/kubeletExtraArgs]
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CompositeProviderTemplate
metadata:
  name: osc-paris-account-a-v1
spec:
  provider: outscale
  account: account-a
  region: eu-west-2
  credentialsRef:
    name: outscale-account-a-eu-west-2
    namePaths: [/credentials/fromSecret]
  infraClusterKind:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: OscCluster
  zones: [eu-west-2a]
  endpointPaths: [spec.controlPlaneEndpoint]
  infrastructureTemplateRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OscClusterTemplate
    namespace: composite-templates
    name: osc-paris-account-a-v1
  bootstrapTemplateRef:
    apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
    kind: KubeadmConfigTemplate
    namespace: composite-templates
    name: outscale-workers-v1
  overridePolicy:
    infraSpecPaths:
      - /network/clusterName
      - /network/internetService/name
      - /network/net/ipRange
    protectedInfraSpecPaths: [/credentials, /network/subregions, /network/disable]
    bootstrapPaths: [/files, /preKubeadmCommands]
    protectedBootstrapPaths: [/joinConfiguration/nodeRegistration/kubeletExtraArgs]
