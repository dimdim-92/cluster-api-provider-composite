# CAPD runs in this disposable management cluster and creates sibling containers.
# Access to the Docker socket is effectively root access to the Docker host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  ipFamily: ipv4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /var/run/docker.sock
        containerPath: /var/run/docker.sock
