# A stand-in for a real provider InfraCluster (OscCluster, OpenStackCluster).
#
# Deliberately declares the **v1beta1** CAPI contract, because that is what both
# providers in scope actually serve while we serve v1beta2. Using a v1beta2 fake
# here would leave the v1beta1 status path -- the one production actually takes --
# untested.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fakeclusters.infrastructure.cluster.x-k8s.io
  labels:
    cluster.x-k8s.io/v1beta1: v1beta1
    cluster.x-k8s.io/provider: infrastructure-fake
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    kind: FakeCluster
    listKind: FakeClusterList
    plural: fakeclusters
    singular: fakecluster
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
