# A stand-in provider MachineTemplate with a TYPED schema, unlike FakeCluster's
# open one. The dry-run validation tests need a CRD that can actually reject a
# payload: type mismatches and missing required fields are exactly what
# DryRunChild exists to surface before the real apply.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fakemachinetemplates.infrastructure.cluster.x-k8s.io
  labels:
    cluster.x-k8s.io/v1beta1: v1beta1
    cluster.x-k8s.io/provider: infrastructure-fake
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    kind: FakeMachineTemplate
    listKind: FakeMachineTemplateList
    plural: fakemachinetemplates
    singular: fakemachinetemplate
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [template]
              properties:
                template:
                  type: object
                  required: [spec]
                  properties:
                    spec:
                      type: object
                      required: [vmType]
                      properties:
                        vmType:
                          type: string
                        diskSizeGiB:
                          type: integer
                          minimum: 10
